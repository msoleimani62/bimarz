name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --config-settings=build-args="--no-default-features" || pip install rich cryptography pytest pytest-cov ruff

      - name: Ruff lint
        run: ruff check orchestrator tests

      - name: Ruff format check
        run: ruff format --check orchestrator tests

      - name: Run pytest with coverage
        run: pytest --cov=bimarz --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  rust-build:
    name: Rust build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine-core -> target

      - name: Fetch official xray-core proto files
        run: |
          XRAY_TAG="v1.8.24"
          git clone --depth 1 --branch "$XRAY_TAG" https://github.com/XTLS/xray-core.git /tmp/xray-core-src
          mkdir -p engine-core/proto
          cp -r /tmp/xray-core-src/app engine-core/proto/
          cp -r /tmp/xray-core-src/common engine-core/proto/
          rm -rf /tmp/xray-core-src

      - name: cargo check
        working-directory: engine-core
        run: cargo check --all-targets

      - name: cargo test
        working-directory: engine-core
        run: cargo test

      - name: cargo clippy
        working-directory: engine-core
        run: cargo clippy --all-targets -- -D warnings

  rust-msrv:
    name: Rust MSRV check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78 toolchain
        uses: dtolnay/rust-toolchain@1.78.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine-core -> target

      - name: Fetch official xray-core proto files
        run: |
          XRAY_TAG="v1.8.24"
          git clone --depth 1 --branch "$XRAY_TAG" https://github.com/XTLS/xray-core.git /tmp/xray-core-src
          mkdir -p engine-core/proto
          cp -r /tmp/xray-core-src/app engine-core/proto/
          cp -r /tmp/xray-core-src/common engine-core/proto/
          rm -rf /tmp/xray-core-src

      - name: cargo check
        working-directory: engine-core
        run: cargo check --all-targets

  integration-test:
    name: Integration test with real xray-core
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - rust-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine-core -> target

      - name: Fetch official xray-core proto files
        run: |
          XRAY_TAG="v1.8.24"
          git clone --depth 1 --branch "$XRAY_TAG" https://github.com/XTLS/xray-core.git /tmp/xray-core-src
          mkdir -p engine-core/proto
          cp -r /tmp/xray-core-src/app engine-core/proto/
          cp -r /tmp/xray-core-src/common engine-core/proto/
          rm -rf /tmp/xray-core-src

      - name: Build Rust extension
        run: |
          source .venv/bin/activate
          pip install maturin
          maturin develop --release

      - name: Install project dependencies
        run: |
          source .venv/bin/activate
          pip install -e .
          pip install pytest pytest-cov rich cryptography

      - name: Download xray-core binary
        run: |
          curl -fsSL -o /tmp/xray.tar.gz "https://github.com/XTLS/xray-core/releases/download/v1.8.24/Xray-linux-64.tar.gz"
          tar -xzf /tmp/xray.tar.gz -C /tmp
          sudo mv /tmp/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run integration tests
        env:
          BIMARZ_PROFILE_PASSWORD: "ci-test-password-12345"
        run: |
          source .venv/bin/activate
          pytest tests/test_integration.py -v --tb=short
