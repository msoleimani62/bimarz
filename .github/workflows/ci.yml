# Continuous Integration workflow for BiMarz
# گردش‌کار یکپارچه‌سازی مداوم برای پروژه BiMarz
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege permissions
# حداقل سطح دسترسی لازم
permissions:
  contents: read

# Cancel previous runs on the same branch
# لغو اجرای قبلی روی همان شاخه
concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  PROTOBUF_PACKAGE: protobuf-compiler
  BIMARZ_PROFILE_PASSWORD: test123
  # Xray-core version used in integration tests
  # نسخه xray-core مورد استفاده در تست‌های یکپارچگی
  XRAY_VERSION: "25.3.6"

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            \~/.cargo
            \~/.rustup
            target
          key: cargo-\( {{ runner.os }}- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.PROTOBUF_PACKAGE }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Install maturin to build the Rust extension
          # نصب maturin برای ساخت افزونه راست
          pip install "maturin>=1.8,<2"

      - name: Build Rust extension
        run: maturin develop --release

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run Python tests
        run: |
          pytest \
            -q \
            --tb=short \
            --cov=bimarz \
            --cov-report=term-missing \
            --cov-fail-under=70


  rust-tests:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: |
            clippy
            rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            \~/.cargo
            \~/.rustup
            target
          key: cargo-\( {{ runner.os }}- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.PROTOBUF_PACKAGE }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo tests
        run: cargo test --all


  integration:
    name: Xray integration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run after unit tests pass
    # فقط بعد از موفقیت تست‌های واحد اجرا شود
    needs:
      - python-tests
      - rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            \~/.cargo
            \~/.rustup
            target
          key: cargo-\( {{ runner.os }}- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.PROTOBUF_PACKAGE }}

      - name: Install xray-core
        run: |
          curl -fsSL \
            "https://github.com/XTLS/Xray-core/releases/download/v${{ env.XRAY_VERSION }}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          sudo unzip -o /tmp/xray.zip -d /usr/local/bin xray
          sudo chmod +x /usr/local/bin/xray

          xray version

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install maturin
        run: |
          pip install "maturin>=1.8,<2"

      - name: Build Rust extension
        run: |
          maturin develop --release

      - name: Run integration tests
        run: |
          pytest \
            -q \
            -m integration \
            --tb=short
