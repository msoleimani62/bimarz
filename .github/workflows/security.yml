# Security audit workflow for BiMarz.
# گردش‌کار بررسی امنیتی وابستگی‌های BiMarz.

name: Security Audit

on:
  schedule:
    # Run every Monday at 06:00 UTC.
    # اجرا در هر دوشنبه ساعت ۶ صبح به وقت UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --manifest-path engine-core/Cargo.toml

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit

  python-bandit:
    name: Python static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install bandit

      - name: Run bandit on orchestrator
        run: bandit -r orchestrator/bimarz -f json -o bandit-report.json

      - name: Display bandit summary
        run: bandit -r orchestrator/bimarz -ll
