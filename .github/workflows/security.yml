# Security audit workflow for BiMarz.
# گردش‌کار بررسی امنیتی وابستگی‌های BiMarz.

name: Security Audit

on:
  schedule:
    # Run every Monday at 06:00 UTC.
    # اجرا در هر دوشنبه ساعت ۶ صبح به وقت UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit -f Cargo.lock

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # `pip install .` compiles the Rust extension via build.rs, which
      # refuses to build without the pinned proto tree (and needs protoc).
      # دستور `pip install .` اکستنشن Rust را از طریق build.rs کامپایل
      # می‌کند که بدون درخت proto پین‌شده از build امتناع می‌کند (و به
      # protoc هم نیاز دارد).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Fetch pinned xray-core proto files
        shell: bash
        run: ./scripts/fetch-protos.sh

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit

  python-bandit:
    name: Python static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Same reason as the pip-audit job: building the package requires the
      # pinned proto tree and protoc.
      # همان دلیل job مربوط به pip-audit: ساخت پکیج به درخت proto پین‌شده
      # و protoc نیاز دارد.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Fetch pinned xray-core proto files
        shell: bash
        run: ./scripts/fetch-protos.sh

      - name: Install project and bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install bandit

      - name: Run bandit on orchestrator
        run: bandit -r orchestrator/bimarz -f json -o bandit-report.json

      - name: Display bandit summary
        run: bandit -r orchestrator/bimarz -ll
