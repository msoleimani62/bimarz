name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64
          - aarch64

    defaults:
      run:
        working-directory: engine-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install maturin
        run: pip install "maturin>=1.8,<2"

      - name: Fetch official xray-core proto files
        shell: bash
        run: |
          set -euo pipefail

          XRAY_TAG="v1.8.24"

          git clone \
            --depth 1 \
            --branch "$XRAY_TAG" \
            https://github.com/XTLS/xray-core.git \
            /tmp/xray-core-src

          mkdir -p proto

          cp -r /tmp/xray-core-src/app proto/
          cp -r /tmp/xray-core-src/common proto/

          rm -rf /tmp/xray-core-src

      - name: Install cross compilation tools
        if: matrix.target == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Build native wheel
        if: matrix.target == 'x86_64'
        run: |
          maturin build \
            --release \
            --target x86_64-unknown-linux-gnu

      - name: Build cross wheel
        if: matrix.target == 'aarch64'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          maturin build \
            --release \
            --target aarch64-unknown-linux-gnu

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: engine-core/target/wheels/*.whl

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
