[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Rust engine adapter for xray-core: gRPC control, health-check, kill-switch, DNS leak guard"
license = "MIT"

# Built as a Python extension module via PyO3, and also usable as a
# plain Rust library/binary for the health-check and kill-switch daemons.
# به‌عنوان یک ماژول پایتونی از طریق PyO3 ساخته می‌شود، و همچنین به‌عنوان یک
# کتابخانه/باینری خالص Rust برای دیمن‌های health-check و kill-switch قابل استفاده است.
[lib]
name = "_engine_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = "0.12"
prost = "0.13"
pyo3 = { version = "0.22", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
base64 = "0.22"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
