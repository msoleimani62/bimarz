[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bimarz"
version = "0.2.0"
description = "Cross-platform orchestrator around xray-core (VLESS+Reality+Vision) with health-check, failover, kill-switch and DNS leak protection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "msoleimani62" }]

keywords = [
    "xray",
    "xray-core",
    "proxy",
    "vpn",
    "vless",
    "reality",
    "vision",
    "network",
    "privacy",
    "security",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = [
    "rich>=13.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
gui = ["PySide6>=6.7"]

[project.scripts]
bimarz = "bimarz.cli:main"

[project.urls]
Homepage = "https://github.com/msoleimani62/bimarz"
Repository = "https://github.com/msoleimani62/bimarz"
Documentation = "https://github.com/msoleimani62/bimarz#readme"
Issues = "https://github.com/msoleimani62/bimarz/issues"

[tool.maturin]
manifest-path = "engine-core/Cargo.toml"
python-source = "orchestrator"
module-name = "bimarz._engine_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["orchestrator"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require running xray-core binary",
]

[tool.coverage.run]
source = ["orchestrator/bimarz"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "bimarz/_engine_core*",
    "bimarz/gui/*",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PERF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"orchestrator/bimarz/constants.py" = ["RUF003"]
"orchestrator/bimarz/failover.py" = ["RUF002"]
"orchestrator/bimarz/gui/connection_worker.py" = ["RUF003"]
"orchestrator/bimarz/gui/profile_table.py" = ["RUF002"]
"orchestrator/bimarz/helpers.py" = ["RUF002"]
"orchestrator/bimarz/profiles.py" = ["RUF002"]
"orchestrator/bimarz/protocols.py" = ["RUF002"]
"orchestrator/bimarz/xray_manager.py" = ["RUF003"]
"tests/unit/test_vless_parser.py" = ["RUF003"]
