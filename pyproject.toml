[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bimarz"
version = "0.1.0"
description = "Cross-platform orchestrator around xray-core (VLESS+Reality+Vision) with health-check, failover, kill-switch and DNS leak protection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "msoleimani62" }]

dependencies = [
    "rich>=13.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
bimarz = "bimarz.cli:main"

[tool.maturin]
# ماژول Rust (engine_core) از این کریت ساخته می‌شود.
# The Rust module (engine_core) is built from this crate.
manifest-path = "engine-core/Cargo.toml"
# کد خالص پایتون در این پوشه است و کنار ماژول کامپایل‌شده‌ی Rust قرار می‌گیرد.
# Pure Python code lives here and sits alongside the compiled Rust module.
python-source = "orchestrator"
module-name = "bimarz._engine_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["orchestrator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
